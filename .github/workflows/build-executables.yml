---
name: Build and Release Executables

permissions:
  contents: read

on:
  push:

# https://hynek.me/articles/python-github-actions/
jobs:
  #
  # 1. Build Windows Executable
  #
  build-windows-exe:
    name: "strat-select.exe creation using python 3.11 on Windows"
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Install dependencies"
        run: |
          uv run python -VV
          uv run python -m site
          uv sync
      - name: "Build windows package"
        run: |
          uv run pyinstaller strat-select.spec
          mkdir -p target/release
          mv dist/strat-select-win.exe target/release
      # a packaged build fails in ways a development one never does - most often by
      # not finding the Qt platform plugin. So run the thing we just built.
      - name: "Smoke test the executable"
        run: ./target/release/strat-select-win.exe --self-test
      # copy script exe to build artifacts so we can test it
      - name: Upload executable to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strat-select-win.exe
          path: target/release/strat-select-win.exe
          # default retention is 90
          retention-days: 15

  # 2. Build MacOS Executable
  #
  # Note that this produces an x86_64 build, so it needs Rosetta on ARM based Macs.
  build-macos-executable:
    name: "strat-select.app creation using python 3.11 on MacOS"
    # The `-intel` images are the x86_64 runners. macos-26-intel is the other
    # option - we stay on 15 so the bundle links against the older SDK and keeps
    # working on the older macOS versions that Intel Macs tend to be stuck on.
    runs-on: "macos-15-intel"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Install dependencies"
        run: |
          uv run python -VV
          uv run python -m site
          uv sync
      # notes:
      # the spec builds onedir on macOS, which an app bundle requires, and sets
      # target_arch=x86_64 to match this runner. See strat-select.spec for what
      # moving to an arm64 build would take.
      - name: "Build MacOS package"
        run: |
          uv run pyinstaller strat-select.spec
          mkdir -p target/release
          ls -l dist/strat-select-macos.app
          mv dist/strat-select-macos target/release
          cd dist && zip -r ../target/release/strat-select-macos.app.zip strat-select-macos.app
          ls -l ../target/release/
      - name: "Smoke test the executable"
        run: ./target/release/strat-select-macos/strat-select-macos --self-test
      # copy script app to build artifacts so we can test it
      - name: Upload executable to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strat-select-macos
          path: target/release/
          # default retention is 90
          retention-days: 15

  # 3. Build Linux Executable
  #
  build-linux-executable:
    name: "executable creation using python 3.11 on Linux"
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v6
      - name: "Install Qt system libraries"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Install dependencies"
        run: |
          uv run python -VV
          uv run python -m site
          uv sync
      - name: "Build Linux package"
        run: |
          uv run pyinstaller strat-select.spec
          mkdir -p target/release
          mv dist/strat-select-linux target/release
      # under xvfb rather than the offscreen platform, so this exercises the xcb
      # plugin - the one that actually goes missing from a packaged build
      - name: "Smoke test the executable"
        run: xvfb-run --auto-servernum ./target/release/strat-select-linux --self-test
      # copy script app to build artifacts so we can test it
      - name: Upload executable to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: strat-select-linux
          path: target/release/strat-select-linux
          # default retention is 90
          retention-days: 15
